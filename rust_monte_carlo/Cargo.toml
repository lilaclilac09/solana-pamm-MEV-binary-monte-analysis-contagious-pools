[package]
name = "mev_monte_carlo"
version = "0.1.0"
edition = "2021"
description = "Rust port of 08_monte_carlo_risk/mev_contagion_monte_carlo.py"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
rand = "0.8"
rand_distr = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
arrow = "55"
parquet = { version = "55", features = ["arrow"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
